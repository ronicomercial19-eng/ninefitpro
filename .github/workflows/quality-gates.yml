name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --import tsx --test src/config/commercialOffer.test.ts
      - name: Payment database regression
        env:
          PGLITE_MODULE: ${{ runner.temp }}/ninefit-db-qa/node_modules/@electric-sql/pglite
        run: |
          npm install --prefix "${{ runner.temp }}/ninefit-db-qa" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.11
          node scripts/qa-infinitepay-db.mjs
          node scripts/qa-activation-profile-db.mjs
          node scripts/qa-app-onboarding-db.mjs
          node scripts/qa-scale-rewards-db.mjs
          node scripts/qa-scale-database.mjs
          node scripts/qa-paid-access-db.mjs
          node scripts/qa-rls-identity.mjs
          node scripts/qa-paged-workspace.mjs
          node scripts/qa-context-history.mjs
          node scripts/qa-signup-identity.mjs
          node scripts/qa-canonical-identity-view.mjs
      - run: node --import tsx --test scripts/qa-auth-first-access.ts scripts/qa-login-flow.ts scripts/qa-protocol-delivery.ts scripts/qa-current-athlete.ts
      - run: npm run qa:fase2
      - run: npm run qa:macro02
      - run: npm run qa:master18
      - run: npm run qa:macro03
      - run: npm run qa:integration19
      - run: npm run build
        if: ${{ always() }}
      - run: node scripts/check-delivery-budget.mjs
      - name: Lint baseline (informational until legacy debt is cleared)
        run: npm run lint
        if: ${{ always() }}
        continue-on-error: true
        # Existing baseline: 805 findings. Typecheck, QA and production build remain blocking.
